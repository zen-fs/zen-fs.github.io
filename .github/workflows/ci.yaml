name: Continuous Deployment
on:
    push:
        branches:
            - main
    workflow_dispatch:
    workflow_call:
    pull_request:
    repository_dispatch:
        types: [docs]

jobs:
    ci:
        name: CI
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            pages: write
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        defaults:
            run:
                shell: bash
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: latest
                  cache: npm

            - name: Cache package sources
              uses: actions/cache@v4
              with:
                  path: .sources
                  key: sources-${{ github.run_id }}
                  restore-keys: sources-

            - name: Install dependencies
              run: npm ci

            - name: Formatting
              run: npm run format:check

            - name: Build
              run: npm run build

            - name: Check links
              run: npm run check-links

            - name: Upload artifact
              if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

            - name: Deploy
              id: deploy
              if: github.event_name != 'pull_request'
              uses: actions/deploy-pages@v4
